<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee8df">
  <meta name="description" content="Mobiler Zugang zum Mairinger-Intranet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Mairinger Intranet</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#242320;background:#f7f6f2;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    header{padding:20px 24px;border-bottom:1px solid #ded8cf;background:#eee8df;font-size:12px;letter-spacing:.28em;font-weight:700}
    main{flex:1;display:grid;place-items:center;padding:48px 22px}
    .card{width:100%;max-width:460px;text-align:center}
    .logo{width:130px;height:130px;border-radius:30px;box-shadow:0 8px 25px #6d5d4e16;object-fit:cover}
    .eyebrow{font-size:12px;letter-spacing:.2em;color:#786b5e;margin-top:32px}
    h1{font-size:clamp(30px,8vw,42px);font-weight:500;line-height:1.12;letter-spacing:-.035em;margin:18px 0}
    p{font-size:16px;line-height:1.65;color:#635a51;margin:0 auto 32px;max-width:360px}
    a.button{display:block;border-radius:5px;background:#786b5e;color:white;padding:17px 22px;text-decoration:none;font-weight:600;font-size:16px;min-height:54px}
    a.button:focus-visible{outline:3px solid #242320;outline-offset:4px}a.button:hover{background:#594f46}
    .note{font-size:12px;color:#786b5e;margin-top:18px;line-height:1.5}
    footer{padding:20px;text-align:center;font-size:12px;color:#786b5e}
  </style>
</head>
<body>
  <header>MAIRINGER &nbsp; / &nbsp; INTRANET</header>
  <main><div class="card">
    <img class="logo" src="./icon-512.png" alt="Mairinger Intranet Symbol">
    <div class="eyebrow">WILLKOMMEN BEI MAIRINGER</div>
    <h1>Alles, was uns verbindet.</h1>
    <p>Dein direkter Weg zu Neuigkeiten, Informationen und Wissenswertem aus unserer Mairinger-Welt.</p>
    <a class="button" id="intranet-link" href="#">Intranet öffnen →</a>
    <div class="note">Für den Zugriff auf SharePoint ist eine entsprechende Berechtigung erforderlich.</div>
  </div></main>
  <footer>MAIRINGER HOLDING</footer>
  <script>
    // HIER DIE VOLLSTAENDIGE SHAREPOINT-ADRESSE EINTRAGEN (MIT https://):
    const SHAREPOINT_URL = "https://mairingerholding.sharepoint.com/sites/MHI-MairingerHoldingInformationsplattform";
    const link = document.getElementById('intranet-link');
    if (SHAREPOINT_URL.startsWith('https://')) {
      link.href = SHAREPOINT_URL;
      link.rel = 'noopener noreferrer';
    } else {
      link.addEventListener('click', e => { e.preventDefault(); alert('Bitte zuerst die SharePoint-Adresse in index.html eintragen.'); });
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
